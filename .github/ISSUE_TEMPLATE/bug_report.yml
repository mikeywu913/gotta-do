name: Bug report / 问题反馈
description: Report a reproducible problem in Gotta Do!
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请勿上传密钥、个人任务或未脱敏日志。Do not include API keys or private data."
  - type: input
    id: version
    attributes:
      label: App version / 软件版本
      placeholder: "0.5.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version / 系统版本
      placeholder: "Windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual results / 预期与实际结果
    validations:
      required: true
